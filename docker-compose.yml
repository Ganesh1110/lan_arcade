services:
  # Graphical Web Browser Gateway (Access via http://<server-ip>:8080)
  arcade-web-gateway:
    build: .
    container_name: lan_arcade_web_gateway
    command: python3 lan_core.py --server --web 8080
    network_mode: host
    restart: always

  # Web Browser Terminal Fallback (Access via http://<server-ip>:8220)
  arcade-web-terminal:
    build: .
    container_name: lan_arcade_web_terminal
    command: ttyd -p 8220 -t fontSize=16 -t theme={'background':'#1e1e1e'} python3 /app/lan_core.py
    network_mode: host
    restart: always

  # Dedicated TCP Server for Native Terminals (Port 50555)
  arcade-server:
    build: .
    container_name: lan_arcade_server
    command: python3 lan_core.py --server
    network_mode: host
    restart: always
